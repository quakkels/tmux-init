# ~/.tmux.conf
# Status bar theme: dark slate/blue

set -g status-style bg=colour234,fg=colour250

# left side: session name
set -g status-left-length 20
set -g status-left "#[bg=colour39,fg=colour234,bold] #S #[bg=colour234,fg=colour250,nobold] "

# right side: date / time
set -g status-right-length 50
set -g status-right "#[fg=colour245]%Y-%m-%d #[fg=colour39,bold]%H:%M "

# window list
setw -g window-status-style bg=colour234,fg=colour245
setw -g window-status-format " #I:#W "

setw -g window-status-current-style bg=colour39,fg=colour234,bold
setw -g window-status-current-format " #I:#W "

# pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# message / command line
set -g message-style bg=colour39,fg=colour234

# mode / choose-tree (prefix+w window picker) highlight
set -g mode-style bg=colour39,fg=colour234

# pane number overlay (prefix+q)
set -g display-panes-colour colour39
set -g display-panes-active-colour colour135

# mouse
set -g mouse on

# 1-based window/pane numbering
set -g base-index 1
setw -g pane-base-index 1
